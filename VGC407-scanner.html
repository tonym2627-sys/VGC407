
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VGC407</title>

<style>
body {
  background: #101218;
  color: #eee;
  font: 16px Arial, sans-serif;
  margin: 18px;
  text-align: center;
}

h1 {
  letter-spacing: 5px;
  color: #8deaff;
}

input, select, button {
  padding: 10px;
  margin: 4px;
  border: 1px solid #555;
  border-radius: 5px;
  font-size: 16px;
  max-width: 90%;
}

button {
  background: #25465b;
  color: white;
  cursor: pointer;
}

.shelf {
  background: #08090c;
  border: 8px solid #252830;
  border-top: 3px solid #71dfff;
  box-shadow: 0 -3px 15px #27b8ef,
    inset 0 8px 20px #174354;
  margin: 25px auto;
  padding: 20px 12px 0;
  text-align: left;
  max-width: 950px;
}

.spine {
  display: inline-block;
  vertical-align: bottom;
  width: 32px;
  height: 165px;
  margin: 0 2px;
  background: #263848;
  border: 1px solid #758392;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 3px 0 5px #000;
}

.spine span {
  position: absolute;
  top: 12px;
  left: 23px;
  width: 145px;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  transform: rotate(90deg);
  transform-origin: 0 0;
}

.spine img {
  width: 100%;
  height: 100%;
}

.ledge {
  height: 12px;
  background: #30343c;
  box-shadow: 0 5px 8px #000;
  margin: 0 -12px 18px;
}

#reader {
  display: none;
  position: relative;
  max-width: 420px;
  margin: 15px auto;
  overflow: hidden;
  border: 2px solid #71dfff;
  border-radius: 10px;
}

#video {
  display: block;
  width: 100%;
  background: black;
}

.scanline {
  position: absolute;
  top: 50%;
  left: 5%;
  width: 90%;
  height: 2px;
  background: #ff3333;
  box-shadow: 0 0 8px red;
  pointer-events: none;
}

#scanStatus {
  color: #8deaff;
  min-height: 22px;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  overflow: auto;
  background: rgba(0,0,0,.94);
  z-index: 5;
}

#stage {
  margin: 25px auto;
  width: 210px;
  height: 290px;
  position: relative;
  perspective: 800px;
}

#case {
  width: 210px;
  height: 290px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform .5s;
}

.face {
  position: absolute;
  background: #263848;
  border: 1px solid #888;
  box-sizing: border-box;
  backface-visibility: hidden;
  overflow: hidden;
}

.face img {
  width: 100%;
  height: 100%;
}

.front, .back {
  width: 210px;
  height: 290px;
}

.front {
  transform: translateZ(12px);
}

.back {
  transform: rotateY(180deg) translateZ(12px);
}

.side {
  width: 24px;
  height: 290px;
  left: 93px;
  transform: rotateY(-90deg) translateZ(105px);
}

.edge {
  width: 24px;
  height: 290px;
  left: 93px;
  transform: rotateY(90deg) translateZ(105px);
}

.top, .bottom {
  width: 210px;
  height: 24px;
  top: 133px;
  transform: rotateX(90deg) translateZ(145px);
}

.bottom {
  transform: rotateX(-90deg) translateZ(145px);
}

.side span {
  display: block;
  width: 270px;
  transform: rotate(90deg);
  transform-origin: 0 0;
  margin-left: 20px;
}

#editor {
  display: none;
}

.danger {
  background: #922d38;
}
</style>
</head>

<body>

<h1>VGC407</h1>
<p>MY GAME COLLECTION</p>
<p id="count"></p>

<div>
  <input id="title" placeholder="Game title">
  <select id="console"></select>
  <input id="cover" placeholder="Front cover URL">
  <button onclick="add()">Add Game</button>
</div>

<div>
  <button onclick="startScan()">Scan Game</button>

  <button onclick="el('photo').click()">
    Scan Photo
  </button>

  <input id="photo" type="file"
    accept="image/*" capture="environment"
    style="display:none"
    onchange="scanPhoto(this)">

  <button onclick="stopScan()">Stop Camera</button>

  <div id="reader">
    <video id="video" autoplay muted playsinline></video>
    <div class="scanline"></div>
  </div>

  <input id="barcode"
    placeholder="Barcode (UPC/EAN)"
    inputmode="numeric">

  <button onclick="lookup()">Find Game</button>

  <p id="scanStatus" role="status"></p>

  <a id="manual" target="_blank"
    rel="noopener" style="color:#8deaff"></a>
</div>

<input id="search"
  placeholder="Search collection"
  oninput="render()">

<div id="shelves"></div>

<div id="viewer">
  <button onclick="closeView()">Close</button>
  <h2 id="name"></h2>

  <div id="stage">
    <div id="case">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
      <div class="face side" id="side"></div>
      <div class="face edge"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>

  <button onclick="rotate(-90)">Rotate Left</button>
  <button onclick="rotate(90)">Rotate Right</button>
  <button onclick="edit()">Edit Artwork</button>
  <button class="danger"
    onclick="removeGame()">Delete</button>

  <div id="editor">
    <p>Front, spine and back artwork</p>
    <input id="ef" placeholder="Front URL">
    <input id="es" placeholder="Spine URL">
    <input id="eb" placeholder="Back URL">
    <button onclick="saveArt()">Save Artwork</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>

<script>

const API =
  "https://vgc407-api.tonym2627.workers.dev/";

let games = [];
let selected = -1;
let angle = 0;
let reader = null;
let scanning = false;
let scanVersion = 0;
let lookupVersion = 0;

function el(id) {
  return document.getElementById(id);
}

function status(text) {
  el("scanStatus").textContent = text;
}

try {
  games = JSON.parse(
    localStorage.getItem("games") || "[]"
  );

  if (!Array.isArray(games)) games = [];

} catch(e) {
  alert("Could not read saved collection.");
}

const groups = {
  Nintendo: "NES|Super Nintendo|Nintendo 64|GameCube|Wii|Wii U|Nintendo Switch|Nintendo Switch 2|Game Boy|Game Boy Color|Game Boy Advance|Nintendo DS|Nintendo 3DS|Virtual Boy|Famicom|Super Famicom",

  PlayStation: "PS1|PS2|PS3|PS4|PS5|PSP|PS Vita",

  Sega: "SG-1000|Master System|Genesis|Mega Drive|Sega CD|Sega 32X|Sega Saturn|Dreamcast|Game Gear|Sega Pico",

  Xbox: "Xbox|Xbox 360|Xbox One|Xbox Series X",

  Atari: "Atari 2600|Atari 5200|Atari 7800|Atari Jaguar|Atari Lynx",

  Other: "TurboGrafx-16|PC Engine|TurboGrafx-CD|Neo Geo AES|Neo Geo CD|Neo Geo Pocket|Neo Geo Pocket Color|3DO|Philips CD-i|ColecoVision|Intellivision|WonderSwan|WonderSwan Color|Playdate|PC|Other"
};

function node(tag, text) {
  const n = document.createElement(tag);
  if (text) n.textContent = text;
  return n;
}

for (const group in groups) {
  const g = node("optgroup");
  g.label = group;

  groups[group].split("|").forEach(name => {
    g.appendChild(node("option", name));
  });

  el("console").appendChild(g);
}

function persist() {
  try {
    localStorage.setItem(
      "games", JSON.stringify(games)
    );
    return true;
  } catch(e) {
    alert("Unable to save collection.");
    return false;
  }
}

function setPlatform(platform, title = "") {
  let p = (platform || "")
    .replace(/\s*\([^)]*\)/g, "")
    .trim();

  const aliases = {
    "PlayStation": "PS1",
    "PlayStation 2": "PS2",
    "PlayStation 3": "PS3",
    "PlayStation 4": "PS4",
    "PlayStation 5": "PS5",
    "PlayStation Vita": "PS Vita",
    "Switch": "Nintendo Switch",
    "Switch 2": "Nintendo Switch 2",
    "Gameboy Advance": "Game Boy Advance",
    "GBA": "Game Boy Advance"
  };

  p = aliases[p] || p;

  const options = Array.from(el("console").options);

  let match = options.find(o =>
    o.value.toLowerCase() === p.toLowerCase()
  );

  if (!match) {
    const text = (p + " " + title).toLowerCase();

    match = options.sort(
      (a,b) => b.value.length - a.value.length
    ).find(o =>
      text.includes(o.value.toLowerCase())
    );
  }

  if (match) {
    el("console").value = match.value;
  } else {
    el("console").value = "Other";
  }
}

function add() {
  const b = el("barcode").value.trim();
  const t = el("title").value.trim();

  if (!t) {
    status("Enter a game title first.");
    return;
  }

  if (b && games.some(g => g.barcode === b)) {
    if (!confirm("Game already exists. Add another copy?")) {
      return;
    }
  }

  games.push({
    title: t,
    platform: el("console").value,
    cover: el("cover").value,
    barcode: b
  });

  if (!persist()) {
    games.pop();
    return;
  }

  el("title").value = "";
  el("cover").value = "";
  el("barcode").value = "";

  lookupVersion++;

  status("Game added to your collection!");
  render();
}

function art(target, url, fallback, spine) {
  target.innerHTML = "";

  if (/^https?:\/\//i.test(url || "")) {
    const im = node("img");
    im.alt = fallback;
    im.src = url;

    im.onerror = function() {
      target.innerHTML = "";
      target.appendChild(
        node(spine ? "span" : "p", fallback)
      );
    };

    target.appendChild(im);

  } else {
    target.appendChild(
      node(spine ? "span" : "p", fallback)
    );
  }
}

function render() {
  const root = el("shelves");
  root.innerHTML = "";

  el("count").textContent =
    "Total games: " + games.length;

  const q = el("search").value.toLowerCase();

  const order = games.map((g,i) => i)
    .filter(i =>
      (games[i].title + " " + games[i].platform)
        .toLowerCase().includes(q)
    )
    .sort((a,b) =>
      games[a].platform.localeCompare(games[b].platform)
      || games[a].title.localeCompare(games[b].title)
    );

  let last = "";
  let shelf = null;

  order.forEach(i => {
    const g = games[i];

    if (g.platform !== last || !shelf) {
      if (shelf) {
        const led = node("div");
        led.className = "ledge";
        shelf.appendChild(led);
      }

      root.appendChild(node("h2", g.platform));

      shelf = node("div");
      shelf.className = "shelf";
      root.appendChild(shelf);

      last = g.platform;
    }

    const s = node("button");
    s.className = "spine";
    s.style.padding = "0";
    s.title = g.title;

    art(s, g.spine, g.title, true);

    s.onclick = () => openGame(i);
    shelf.appendChild(s);
  });

  if (shelf) {
    const led = node("div");
    led.className = "ledge";
    shelf.appendChild(led);
  } else {
    root.appendChild(
      node("p", "No games to display.")
    );
  }
}

function openGame(i) {
  selected = i;

  const g = games[i];

  el("name").textContent =
    g.title + " - " + g.platform;

  art(el("front"), g.cover, g.title, false);
  art(el("back"), g.back,
    "Back artwork not added", false);
  art(el("side"), g.spine, g.title, true);

  el("viewer").style.display = "block";
  el("editor").style.display = "none";

  angle = -65;
  rotate(0);

  setTimeout(() => {
    if (selected === i) {
      angle = -20;
      rotate(0);
    }
  }, 50);
}

function rotate(d) {
  angle += d;
  el("case").style.transform =
    "rotateY(" + angle + "deg)";
}

function closeView() {
  selected = -1;
  el("viewer").style.display = "none";
}

function edit() {
  const g = games[selected];

  el("ef").value = g.cover || "";
  el("es").value = g.spine || "";
  el("eb").value = g.back || "";

  el("editor").style.display = "block";
}

function saveArt() {
  const g = games[selected];

  g.cover = el("ef").value;
  g.spine = el("es").value;
  g.back = el("eb").value;

  persist();
  render();
  openGame(selected);
}

function removeGame() {
  if (confirm("Delete this game?")) {
    games.splice(selected, 1);
    persist();
    closeView();
    render();
  }
}

/* NEW BARCODE SCANNER */

function createReader() {
  const hints = new Map();

  hints.set(
    ZXing.DecodeHintType.POSSIBLE_FORMATS,
    [
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8
    ]
  );

  hints.set(
    ZXing.DecodeHintType.TRY_HARDER,
    true
  );

  return new ZXing.BrowserMultiFormatReader(
    hints, 150
  );
}

async function startScan() {
  if (scanning) return;

  if (typeof ZXing === "undefined") {
    status("Scanner library unavailable. Refresh the page.");
    return;
  }

  if (!navigator.mediaDevices) {
    status("Camera access is unavailable.");
    return;
  }

  const version = ++scanVersion;

  scanning = true;
  reader = createReader();

  const activeReader = reader;

  el("reader").style.display = "block";

  status("Point your rear camera at the barcode.");

  try {
    await activeReader.decodeFromConstraints(
      {
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      },
      el("video"),
      function(result, error) {

        if (!scanning ||
            version !== scanVersion) return;

        if (result) {
          const code = result.getText();

          if (/^\d{8,14}$/.test(code)) {
            el("barcode").value = code;
            stopScan();
            status("Barcode detected: " + code);
            lookup();
          }
        }
      }
    );

    if (version !== scanVersion) {
      activeReader.reset();
    }

  } catch(e) {
    if (version === scanVersion) {
      stopScan();
      status("Camera unavailable. Try Scan Photo or enter the barcode manually.");
    }
  }
}

function stopScan() {
  scanning = false;
  scanVersion++;

  if (reader) {
    try {
      reader.reset();
    } catch(e) {}

    reader = null;
  }

  const stream = el("video").srcObject;

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  el("video").srcObject = null;
  el("reader").style.display = "none";
}

async function scanPhoto(input) {
  if (!input.files.length) return;

  stopScan();

  if (typeof ZXing === "undefined") {
    status("Scanner library unavailable.");
    input.value = "";
    return;
  }

  status("Reading barcode from photo...");

  const file = input.files[0];
  const url = URL.createObjectURL(file);
  const photoReader = createReader();

  try {
    const result =
      await photoReader.decodeFromImageUrl(url);

    const code = result.getText();

    if (!/^\d{8,14}$/.test(code)) {
      throw new Error("Invalid barcode");
    }

    el("barcode").value = code;

    status("Barcode detected: " + code);
    lookup();

  } catch(e) {
    status("Could not read photo. Try better lighting or a clearer picture.");
  } finally {
    photoReader.reset();
    URL.revokeObjectURL(url);
    input.value = "";
  }
}

/* DATABASE LOOKUP */

async function lookup() {
  const b = el("barcode").value.trim();
  const v = ++lookupVersion;

  if (!/^\d{8,14}$/.test(b)) {
    status("Enter an 8 to 14 digit barcode.");
    return;
  }

  el("manual").href =
    "https://www.google.com/search?q=" +
    encodeURIComponent(b + " video game box art");

  el("manual").textContent = "Search manually";

  const existing = games.find(g =>
    String(g.barcode || "").replace(/^0+/, "") ===
    b.replace(/^0+/, "")
  );

  if (existing) {
    el("title").value = existing.title;
    setPlatform(existing.platform, existing.title);
    el("cover").value = existing.cover || "";

    status("Game already in your collection.");
    return;
  }

  el("title").value = "";
  el("cover").value = "";
  el("console").value = "Other";

  status("Searching VGC407 database...");

  try {
    const response = await fetch(
      API + "?barcode=" + encodeURIComponent(b)
    );

    if (!response.ok) {
      throw new Error("Database unavailable");
    }

    const d = await response.json();

    if (v !== lookupVersion ||
        el("barcode").value.trim() !== b) return;

    if (!d.found) {
      status("Game not found. Try manual search.");
      return;
    }

    el("title").value = d.title || "";
    setPlatform(d.platform, d.title);
    el("cover").value = d.image || "";

    status("Game found! Verify details and tap Add Game.");

  } catch(e) {
    if (v === lookupVersion) {
      status("Database unavailable. Please try again.");
    }
  }
}

window.addEventListener("pagehide", stopScan);

render();

</script>
</body>
</html>
