*{box-sizing:border-box}body{margin:0;background:#10131a;color:#e9edf4;font:16px Arial,sans-serif}header{text-align:center;padding:18px;background:#151b25;border-bottom:1px solid #38778d}h1{margin:0;color:#8deaff;letter-spacing:6px}small{color:#a9bac9}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px}button,input,select,a{font:inherit;padding:10px;border:1px solid #41566a;border-radius:7px;background:#202c39;color:white}a{text-decoration:none}button{cursor:pointer}#room{height:65vh;min-height:320px;touch-action:none}canvas{display:block}#status,#stats{text-align:center;padding:8px}#status{color:#9de8ff}#viewer{position:fixed;inset:0;background:#10131a;z-index:5;overflow:auto;text-align:center;padding:12px}#caseView{height:48vh;touch-action:none}#fallback{padding:12px}#fallback button{margin:4px}#details{line-height:1.8}label{align-self:center} [hidden]{display:none!important}
</style></head><body><header><h1>VGC407</h1><small>THE COLLECTION ROOM · 2.2</small></header><nav><a href="VGC407-scanner.html">+ Add / Scan</a><input id="search" placeholder="Search games"><select id="platform"><option value="">All consoles</option></select><label><input type="checkbox" id="empty" checked> Empty shelves</label><label>LED <input id="brightness" type="range" min="0" max="100" value="85" aria-label="Shelf lighting brightness"></label><button id="reset">Reset view</button></nav><div id="stats"></div><div id="room"></div><div id="fallback" hidden></div><div id="status">Loading 3D cabinet…</div><section id="viewer" hidden><button id="close">Return to shelf</button><h2 id="name"></h2><div id="caseView"></div><nav><button data-face="front">Front</button><button data-face="spine">Spine</button><button data-face="back">Back</button></nav><div id="details"></div><nav><a href="VGC407-scanner.html">Manage collection / artwork</a><a id="price" target="_blank" rel="noopener">Check market value</a></nav></section>
<script type="module">
const $=id=>document.getElementById(id);
const systems='NES|Super Nintendo|Nintendo 64|GameCube|Wii|Wii U|Nintendo Switch|Nintendo Switch 2|Famicom|Super Famicom|Virtual Boy|Game Boy|Game Boy Color|Game Boy Advance|Nintendo DS|Nintendo 3DS|PS1|PS2|PS3|PS4|PS5|PSP|PS Vita|Xbox|Xbox 360|Xbox One|Xbox Series X|SG-1000|Master System|Genesis|Mega Drive|Sega CD|Sega 32X|Sega Saturn|Dreamcast|Game Gear|Sega Pico|Atari 2600|Atari 5200|Atari 7800|Atari Jaguar|Atari Jaguar CD|Atari Lynx|TurboGrafx-16|TurboGrafx-CD|PC Engine|PC-FX|Neo Geo AES|Neo Geo CD|Neo Geo Pocket|Neo Geo Pocket Color|WonderSwan|WonderSwan Color|3DO|Philips CD-i|ColecoVision|Intellivision|Odyssey|Odyssey 2|Vectrex|Playdate|PC|Other'.split('|');
const themeColors={"NES": "#c72b35", "Super Nintendo": "#8060bb", "Nintendo 64": "#26934b", "GameCube": "#7351bc", "Wii": "#bceaff", "Wii U": "#00a9dc", "Nintendo Switch": "#ed2438", "Nintendo Switch 2": "#ff4b50", "Famicom": "#a62d38", "Super Famicom": "#a3a5bb", "Virtual Boy": "#ff3030", "Game Boy": "#9ca653", "Game Boy Color": "#a855d5", "Game Boy Advance": "#6664c9", "Nintendo DS": "#c3c8d1", "Nintendo 3DS": "#d93842", "PS1": "#b6bbc4", "PS2": "#315dff", "PS3": "#e82c39", "PS4": "#168cff", "PS5": "#e9f5ff", "PSP": "#a7aab3", "PS Vita": "#1e8cdb", "Xbox": "#59b52d", "Xbox 360": "#8bc34a", "Xbox One": "#107c10", "Xbox Series X": "#36e629", "SG-1000": "#5b8ed9", "Master System": "#e63232", "Genesis": "#dc3030", "Mega Drive": "#4678d1", "Sega CD": "#5077ce", "Sega 32X": "#e7ba37", "Sega Saturn": "#b9bec7", "Dreamcast": "#ff7830", "Game Gear": "#4388da", "Sega Pico": "#f1c33d", "TurboGrafx-16": "#f38a28", "TurboGrafx-CD": "#f38a28", "PC Engine": "#f1e8d9", "PC-FX": "#dce4ed", "Neo Geo AES": "#d5ab48", "Neo Geo CD": "#d5ab48", "Neo Geo Pocket": "#6c8ebc", "Neo Geo Pocket Color": "#a970db", "WonderSwan": "#91b5d4", "WonderSwan Color": "#ed9a47", "3DO": "#e8b84c", "Philips CD-i": "#71b4d4", "ColecoVision": "#dbba64", "Intellivision": "#bda36c", "Odyssey": "#e5e0ce", "Odyssey 2": "#d4c1a2", "Vectrex": "#9da7b8", "Playdate": "#ffcf32", "PC": "#56b9c4", "Other": "#8deaff"};
function theme(p){return themeColors[p]||(/^Atari/.test(p)?"#d63232":"#8deaff");}
let games=[];try{games=JSON.parse(localStorage.getItem('games')||'[]');if(!Array.isArray(games))games=[];}catch(e){}const demo=!games.length;if(demo)games=['Resident Evil 4','Tekken 8','Final Fantasy XVI','Spider-Man 2'].map(title=>({title,platform:'PS5'})).concat(['Mario Kart 8 Deluxe','Super Mario Odyssey'].map(title=>({title,platform:'Nintendo Switch'})));
function platform(g){let p=String(g.platform||'Other').replace(/\s*\([^)]*\)/g,'').trim();return ({'Nintendo':'NES','SNES':'Super Nintendo','PlayStation':'PS1','PlayStation 1':'PS1','PlayStation 2':'PS2','PlayStation 3':'PS3','PlayStation 4':'PS4','PlayStation 5':'PS5','Xbox 1':'Xbox One','Nintendo Wii':'Wii','Nintendo Wii U':'Wii U','GBA':'Game Boy Advance'})[p]||p;}
for(const p of new Set([...systems,...games.map(platform)])){$('platform').add(new Option(p,p));}
function filtered(){return games.filter(g=>(!$('platform').value||platform(g)===$('platform').value)&&String(g.title).toLowerCase().includes($('search').value.toLowerCase())).sort((a,b)=>String(a.title).localeCompare(String(b.title)));}
function details(g){$('name').textContent=g.title;$('details').textContent=[platform(g),g.region,g.condition,g.purchasePrice!=null&&g.purchasePrice!==''?'Paid: $'+g.purchasePrice:'', (g.currentValue??g.value)!=null&&(g.currentValue??g.value)!==''?'Recorded value: $'+(g.currentValue??g.value):'Value not recorded'].filter(Boolean).join(' · ');$('price').href='https://www.pricecharting.com/search-products?q='+encodeURIComponent(g.title+' '+platform(g));}
function fallback(){ $('room').hidden=true;$('fallback').hidden=false;$('status').textContent='3D unavailable on this browser. Collection list is available below.';const draw=()=>{$('fallback').replaceChildren();const list=filtered();for(const p of new Set([...systems,...games.map(platform)])){if($('platform').value&&p!==$('platform').value)continue;const group=list.filter(g=>platform(g)===p);if(!group.length&&(!$('empty').checked||$('search').value))continue;const shelf=document.createElement('section');shelf.style.cssText='margin:12px auto;padding:12px;background:#17191e;border:5px solid #34363d;border-top:4px solid '+theme(p);const h=document.createElement('h3');h.textContent=p;h.style.color=theme(p);shelf.append(h);for(const g of group){const b=document.createElement('button');b.textContent=g.title;b.onclick=()=>{details(g);$('viewer').hidden=false;$('caseView').hidden=true;};shelf.append(b);}if(!group.length)shelf.append('Empty shelf');$('fallback').append(shelf);}};$('search').oninput=draw;$('platform').onchange=draw;$('empty').onchange=draw;draw();}
$('close').onclick=()=>{$('viewer').hidden=true;};
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);const camera=new THREE.PerspectiveCamera(42,1,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('room').append(renderer.domElement);renderer.outputColorSpace=THREE.SRGBColorSpace;scene.add(new THREE.HemisphereLight(0xdceaff,0x30323b,1.7));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(4,8,10);scene.add(light);
const cabinet=new THREE.Group();scene.add(cabinet);const c=document.createElement('canvas');c.width=256;c.height=256;const ctx=c.getContext('2d');ctx.fillStyle='#202126';ctx.fillRect(0,0,256,256);for(let i=0;i<500;i++){ctx.strokeStyle=i%2?'#292a30':'#191a1e';ctx.beginPath();const y=Math.random()*256;ctx.moveTo(0,y);ctx.lineTo(256,y+Math.random()*3);ctx.stroke();}const grain=new THREE.CanvasTexture(c);grain.colorSpace=THREE.SRGBColorSpace;const wood=new THREE.MeshStandardMaterial({map:grain,roughness:.8});const trim=new THREE.MeshStandardMaterial({color:0x101115,roughness:.6});const led=new THREE.MeshBasicMaterial({color:0x73dcff});const glow=new THREE.MeshBasicMaterial({color:0x174c65,transparent:true,opacity:.5});
function box(parent,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);parent.add(m);return m;}
function tex(text,bg,spine=false,sign=false){const c=document.createElement('canvas');c.width=sign?512:spine?128:384;c.height=sign?64:512;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.fillStyle=sign&&new THREE.Color(bg).getLuminance()>.45?'#10131a':'#fff';x.textAlign='center';if(spine){x.translate(64,256);x.rotate(Math.PI/2);x.font='bold 26px Arial';x.fillText(text,0,8,480);}else{x.font=sign?'bold 30px Arial':'bold 30px Arial';x.fillText(text,c.width/2,sign?43:250,c.width-20);}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const loader=new THREE.TextureLoader();let db;async function artURL(s){if(typeof s!=='string')return null;if(/^art:/.test(s)){if(!db)db=await new Promise((res,rej)=>{const r=indexedDB.open('VGC407Artwork',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});const blob=await new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(s);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return blob?URL.createObjectURL(blob):null;}return /^(https?:|data:image\/)/i.test(s)?s:null;}
function art(s,title,color,spine=false){const m=new THREE.MeshStandardMaterial({map:tex(title,color,spine),roughness:.7});artURL(s).then(url=>{if(!url||m.userData.dead)return;loader.load(url,t=>{if(url.startsWith('blob:'))URL.revokeObjectURL(url);if(m.userData.dead){t.dispose();return;}t.colorSpace=THREE.SRGBColorSpace;m.map.dispose();m.map=t;m.needsUpdate=true;},undefined,()=>{if(url.startsWith('blob:'))URL.revokeObjectURL(url);});}).catch(()=>{});return m;}
function dims(p){if(/Super Nintendo|Nintendo 64|Super Famicom|Atari Jaguar/.test(p))return [.98,.69,.19];if(/Game Boy|Game Gear|Neo Geo Pocket|WonderSwan/.test(p))return [.67,.72,.19];if(/PS1|Dreamcast|Sega CD|Neo Geo CD|TurboGrafx-CD/.test(p))return [.77,.68,.10];if(/Nintendo DS|Nintendo 3DS/.test(p))return [.79,.72,.14];if(/Switch|PS Vita|PSP/.test(p))return [.65,1.02,.10];if(/NES|Genesis|Master System|Saturn|Atari/.test(p))return [.79,1.1,.20];return [.77,1.08,.14];}
function make(g){const p=platform(g),d=dims(p),color=/Switch/.test(p)?'#b51d31':/Xbox/.test(p)?'#267940':/PS4|PS5|Wii U/.test(p)?'#2456a0':'#33343a';const plastic=new THREE.MeshStandardMaterial({color});const m=new THREE.Mesh(new THREE.BoxGeometry(...d),[plastic,art(g.spine,g.title,color,true),plastic,plastic,art(g.cover||g.front,g.title,color),art(g.back,'Back unavailable',color)]);m.userData.game=g;return m;}
function clear(group){for(const o of [...group.children]){group.remove(o);o.traverse(m=>{m.geometry?.dispose();for(const a of Array.isArray(m.material)?m.material:[m.material])if(a&&![wood,trim,led,glow].includes(a)){a.userData.dead=true;a.map?.dispose();a.dispose();}});}}
let cases=[],hover=null,selected=null,height=4,orbit=0,zoom=1,pan=0;const width=7.2,rowH=1.55;
function build(){clear(cabinet);cases=[];hover=selected=null;const list=filtered(),rows=[];for(const p of new Set([...systems,...games.map(platform)])){if($('platform').value&&p!==$('platform').value)continue;const group=list.filter(g=>platform(g)===p);if(!group.length){if($('empty').checked&&!$('search').value)rows.push({p,games:[]});continue;}let row=[],used=0;for(const g of group){const d=dims(p)[2]+.035;if(used+d>width-.6){rows.push({p,games:row});row=[];used=0;}row.push(g);used+=d;}if(row.length)rows.push({p,games:row});}height=Math.max(1,rows.length)*rowH+.3;box(cabinet,width+.2,height,.16,0,0,-.65,wood);for(const x of [-width/2,width/2])box(cabinet,.22,height,1.4,x,0,0,wood);for(let i=0;i<=Math.max(1,rows.length);i++){const y=height/2-.15-i*rowH;box(cabinet,width,.17,1.4,0,y,0,wood);box(cabinet,width,.19,.07,0,y,.72,trim);}rows.forEach((r,i)=>{const y=height/2-.15-(i+1)*rowH+.085;const color=theme(r.p), power=Number($('brightness').value)/100;
const ledMat=new THREE.MeshBasicMaterial({color:new THREE.Color(color).multiplyScalar(power)});
const glowMat=new THREE.MeshBasicMaterial({color,transparent:true,opacity:.24*power,depthWrite:false});
box(cabinet,width-.4,.035,.04,0,y+rowH-.205,.55,ledMat);
box(cabinet,width-.4,.22,.02,0,y+rowH-.32,-.54,glowMat);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(2.5,.22),new THREE.MeshBasicMaterial({map:tex(r.p,color,false,true)}));sign.position.set(0,y+1.29,.72);cabinet.add(sign);let x=-width/2+.26;for(const g of r.games){const m=make(g),d=dims(r.p);x+=d[2]/2;m.rotation.y=Math.PI/2;m.position.set(x,y+d[1]/2,.25-d[0]/2);m.userData.home=m.position.z;cabinet.add(m);cases.push(m);x+=d[2]/2+.035;}});$('stats').textContent=(demo?'Demo · ':'')+list.length+' games · '+rows.length+' shelves';reset();}
function reset(){orbit=0;zoom=height>12?12/(height*1.4):1;pan=height>12?height/2-5:0;selected=hover=null;$('status').textContent='Hover or tap to slide out · Double-click or double-tap to inspect · Drag to explore';}
$('reset').onclick=reset;$('search').oninput=build;$('platform').onchange=build;$('empty').onchange=build;$('brightness').onchange=build;
const ray=new THREE.Raycaster();function hit(e){const r=renderer.domElement.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2),camera);return ray.intersectObjects(cases)[0]?.object||null;}
let down=null,lastTap=null,lastTime=0;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,orbit,pan,moved:false};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>8)down.moved=true;if(down.moved){hover=null;orbit=Math.max(-.65,Math.min(.65,down.orbit-dx*.004));pan=Math.max(-height/2,Math.min(height/2,down.pan+dy*.025*zoom));}}else if(e.pointerType==='mouse'){hover=hit(e);if(hover)$('status').textContent=hover.userData.game.title+' · Double-click to inspect';}});canvas.addEventListener('pointerleave',()=>hover=null);canvas.addEventListener('pointercancel',()=>down=null);canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=down.moved;down=null;if(moved)return;const m=hit(e);if(!m){selected=null;lastTap=null;return;}const now=performance.now();if(lastTap===m&&now-lastTime<500){open(m.userData.game);lastTap=null;}else{selected=m;lastTap=m;lastTime=now;$('status').textContent=m.userData.game.title+' · Double-tap to inspect';}});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.025,Math.min(2,zoom*Math.exp(e.deltaY*.001)));},{passive:false});
const zoomNav=document.createElement('nav');for(const [text,f] of [['Zoom in',.72],['Zoom out',1.38]]){const b=document.createElement('button');b.textContent=text;b.onclick=()=>zoom=Math.max(.025,Math.min(2,zoom*f));zoomNav.append(b);} $('room').after(zoomNav);
const vs=new THREE.Scene();vs.background=new THREE.Color(0x10131a);vs.add(new THREE.HemisphereLight(0xffffff,0x555555,2.5));const vc=new THREE.PerspectiveCamera(35,1,.1,100);vc.position.z=2.8;const vr=new THREE.WebGLRenderer({antialias:true});vr.setPixelRatio(Math.min(devicePixelRatio,1.5));$('caseView').append(vr.domElement);const vg=new THREE.Group();vs.add(vg);function open(g){details(g);clear(vg);vg.add(make(g));vg.rotation.set(0,0,0);$('viewer').hidden=false;resize();}document.querySelectorAll('[data-face]').forEach(b=>b.onclick=()=>vg.rotation.set(0,({front:0,spine:Math.PI/2,back:Math.PI})[b.dataset.face],0));let drag=null;vr.domElement.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY};vr.domElement.setPointerCapture(e.pointerId);};vr.domElement.onpointermove=e=>{if(drag){vg.rotation.y+=(e.clientX-drag.x)*.015;vg.rotation.x+=(e.clientY-drag.y)*.01;drag={x:e.clientX,y:e.clientY};}};vr.domElement.onpointerup=vr.domElement.onpointercancel=()=>drag=null;
function resize(){for(const [r,cam,id] of [[renderer,camera,'room'],[vr,vc,'caseView']]){const w=$(id).clientWidth,h=$(id).clientHeight;if(w&&h){r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();}}}window.addEventListener('resize',resize);window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});build();resize();renderer.setAnimationLoop(()=>{const distance=Math.max(11,height*1.4,10/camera.aspect)*zoom;camera.position.set(Math.sin(orbit)*distance,pan+.4,Math.cos(orbit)*distance);camera.lookAt(0,pan,0);for(const m of cases){const target=m.userData.home+((m===hover||m===selected)?.42:0);m.position.z+=(target-m.position.z)*.18;}renderer.render(scene,camera);if(!$('viewer').hidden)vr.render(vs,vc);});
}catch(e){console.error(e);fallback();}
