<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VGC407 2.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#101216;color:#eee;font:16px Arial,sans-serif}header{text-align:center;padding:22px}h1{letter-spacing:6px;color:#8deaff;margin:0}small{color:#aab6c2}nav{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;padding:10px}button,input,select,a{font:inherit;color:inherit;background:#20252e;border:1px solid #49515e;border-radius:7px;padding:10px}button,a{cursor:pointer}a{text-decoration:none}#stats,#status{text-align:center;padding:8px;color:#b6c7d5}#cabinet{max-width:1100px;margin:15px auto 40px;border:clamp(9px,2vw,24px) solid #29282a;border-radius:4px;box-shadow:0 15px 30px #000, inset 0 0 15px #000;background:#222;overflow:hidden}.bay{position:relative;background:linear-gradient(180deg,#0009,transparent 35%,#0008),repeating-linear-gradient(92deg,#171719 0px,#202022 3px,#19191b 8px,#171719 16px);box-shadow:inset 12px 0 18px #0009,inset -12px 0 18px #0009;padding:8px 12px 0;border-bottom:18px solid #303033;border-image:linear-gradient(#535154,#242326 25%,#151416 90%,#363438) 1}.bay h2{font-size:14px;letter-spacing:2px;text-transform:uppercase;text-align:center;margin:0 0 8px;color:var(--led)}.strip{height:3px;background:var(--led);box-shadow:0 3px 18px 4px var(--led);opacity:var(--power);margin-bottom:14px}.books{display:flex;flex-wrap:wrap;align-items:flex-end;gap:3px;min-height:125px;padding:12px 4px 0;row-gap:24px}.game{position:relative;flex:none;width:var(--w);height:var(--h);padding:0;border-radius:2px;border:1px solid #ffffff40;background:linear-gradient(90deg,#0007,transparent 25%,#fff2 70%,#0008),var(--led);box-shadow:3px 2px 5px #000;transition:transform .18s,box-shadow .18s;touch-action:manipulation;overflow:hidden}.game span{writing-mode:vertical-rl;display:block;margin:auto;font-size:11px;font-weight:bold;max-height:90%;overflow:hidden;white-space:nowrap;color:white;text-shadow:0 1px 3px #000}.game img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.game.selected,.game:focus-visible{transform:translateY(-12px) scale(1.09);z-index:2;box-shadow:5px 10px 12px #000,0 0 2px 2px var(--led)}@media(hover:hover){.game:hover{transform:translateY(-12px) scale(1.09);z-index:2;box-shadow:5px 10px 12px #000}}.empty{color:#777;font-size:13px;padding:30px 8px}.bay:after{content:'';display:block;height:4px;background:#111;box-shadow:0 -2px 6px #000}#viewer{position:fixed;inset:0;background:#101216f9;z-index:10;overflow:auto;text-align:center;padding:15px} [hidden]{display:none!important}#stage{perspective:850px;height:340px;display:grid;place-items:center;touch-action:none}#case{position:relative;transform-style:preserve-3d;transition:transform .25s;width:var(--cw);height:var(--ch)}.face{position:absolute;inset:0;background:#30343c;border:1px solid #888;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.front{transform:translateZ(var(--half))}.back{transform:rotateY(180deg) translateZ(var(--half))}.spine,.edge{width:var(--depth);left:calc((var(--cw) - var(--depth))/2);transform:rotateY(-90deg) translateZ(calc(var(--cw)/2))}.edge{transform:rotateY(90deg) translateZ(calc(var(--cw)/2))}.spine span{writing-mode:vertical-rl}.top,.bottom{height:var(--depth);top:calc((var(--ch) - var(--depth))/2);transform:rotateX(90deg) translateZ(calc(var(--ch)/2))}.bottom{transform:rotateX(-90deg) translateZ(calc(var(--ch)/2))}#details{line-height:1.8}#selection{text-align:center;min-height:24px;color:#8deaff} @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header><h1>VGC407</h1><small>REALISTIC MEDIA SHELF · 2.3</small></header><nav><a href="VGC407-scanner.html">+ Add / Scan</a><input id="search" placeholder="Search games"><select id="platform"><option value="">All consoles</option></select><label><input type="checkbox" id="empty"> Show empty shelves</label><label>LED <input id="brightness" type="range" min="0" max="100" value="85"></label></nav><div id="stats"></div><div id="status">Hover or tap to pull out · Double-click or double-tap to inspect</div><div id="selection" aria-live="polite"></div><main id="cabinet"></main><section id="viewer" hidden><button id="close">Return to shelf</button><h2 id="name"></h2><div id="stage"><div id="case"><div class="face front" id="front"></div><div class="face back" id="back"></div><div class="face spine" id="spine"></div><div class="face edge"></div><div class="face top"></div><div class="face bottom"></div></div></div><nav><button data-angle="0">Front</button><button data-angle="90">Spine</button><button data-angle="180">Back</button></nav><div id="details"></div><nav><a href="VGC407-scanner.html">Manage collection / artwork</a><a id="price" target="_blank" rel="noopener">Check market value</a></nav></section><script>
const $=id=>document.getElementById(id);
const systems='NES|Super Nintendo|Nintendo 64|GameCube|Wii|Wii U|Nintendo Switch|Nintendo Switch 2|Famicom|Super Famicom|Virtual Boy|Game Boy|Game Boy Color|Game Boy Advance|Nintendo DS|Nintendo 3DS|PS1|PS2|PS3|PS4|PS5|PSP|PS Vita|Xbox|Xbox 360|Xbox One|Xbox Series X|SG-1000|Master System|Genesis|Mega Drive|Sega CD|Sega 32X|Sega Saturn|Dreamcast|Game Gear|Sega Pico|Atari 2600|Atari 5200|Atari 7800|Atari Jaguar|Atari Jaguar CD|Atari Lynx|TurboGrafx-16|TurboGrafx-CD|PC Engine|PC-FX|Neo Geo AES|Neo Geo CD|Neo Geo Pocket|Neo Geo Pocket Color|WonderSwan|WonderSwan Color|3DO|Philips CD-i|ColecoVision|Intellivision|Odyssey|Odyssey 2|Vectrex|Playdate|PC|Other'.split('|');
const themeColors={"NES": "#c72b35", "Super Nintendo": "#8060bb", "Nintendo 64": "#26934b", "GameCube": "#7351bc", "Wii": "#bceaff", "Wii U": "#00a9dc", "Nintendo Switch": "#ed2438", "Nintendo Switch 2": "#ff4b50", "Famicom": "#a62d38", "Super Famicom": "#a3a5bb", "Virtual Boy": "#ff3030", "Game Boy": "#9ca653", "Game Boy Color": "#a855d5", "Game Boy Advance": "#6664c9", "Nintendo DS": "#c3c8d1", "Nintendo 3DS": "#d93842", "PS1": "#b6bbc4", "PS2": "#315dff", "PS3": "#e82c39", "PS4": "#168cff", "PS5": "#e9f5ff", "PSP": "#a7aab3", "PS Vita": "#1e8cdb", "Xbox": "#59b52d", "Xbox 360": "#8bc34a", "Xbox One": "#107c10", "Xbox Series X": "#36e629", "SG-1000": "#5b8ed9", "Master System": "#e63232", "Genesis": "#dc3030", "Mega Drive": "#4678d1", "Sega CD": "#5077ce", "Sega 32X": "#e7ba37", "Sega Saturn": "#b9bec7", "Dreamcast": "#ff7830", "Game Gear": "#4388da", "Sega Pico": "#f1c33d", "TurboGrafx-16": "#f38a28", "TurboGrafx-CD": "#f38a28", "PC Engine": "#f1e8d9", "PC-FX": "#dce4ed", "Neo Geo AES": "#d5ab48", "Neo Geo CD": "#d5ab48", "Neo Geo Pocket": "#6c8ebc", "Neo Geo Pocket Color": "#a970db", "WonderSwan": "#91b5d4", "WonderSwan Color": "#ed9a47", "3DO": "#e8b84c", "Philips CD-i": "#71b4d4", "ColecoVision": "#dbba64", "Intellivision": "#bda36c", "Odyssey": "#e5e0ce", "Odyssey 2": "#d4c1a2", "Vectrex": "#9da7b8", "Playdate": "#ffcf32", "PC": "#56b9c4", "Other": "#8deaff"};
function theme(p){return themeColors[p]||(/^Atari/.test(p)?"#d63232":"#8deaff");}
let games=[];try{games=JSON.parse(localStorage.getItem('games')||'[]');if(!Array.isArray(games))games=[];}catch(e){}const demo=!games.length;if(demo)games=['Resident Evil 4','Tekken 8','Final Fantasy XVI','Spider-Man 2'].map(title=>({title,platform:'PS5'})).concat(['Mario Kart 8 Deluxe','Super Mario Odyssey'].map(title=>({title,platform:'Nintendo Switch'})));
function platform(g){let p=String(g.platform||'Other').replace(/\s*\([^)]*\)/g,'').trim();return ({'Nintendo':'NES','SNES':'Super Nintendo','PlayStation':'PS1','PlayStation 1':'PS1','PlayStation 2':'PS2','PlayStation 3':'PS3','PlayStation 4':'PS4','PlayStation 5':'PS5','Xbox 1':'Xbox One','Nintendo Wii':'Wii','Nintendo Wii U':'Wii U','GBA':'Game Boy Advance'})[p]||p;}
for(const p of new Set([...systems,...games.map(platform)])){$('platform').add(new Option(p,p));}
function filtered(){return games.filter(g=>(!$('platform').value||platform(g)===$('platform').value)&&String(g.title).toLowerCase().includes($('search').value.toLowerCase())).sort((a,b)=>String(a.title).localeCompare(String(b.title)));}
function details(g){$('name').textContent=g.title;$('details').textContent=[platform(g),g.region,g.condition,g.purchasePrice!=null&&g.purchasePrice!==''?'Paid: $'+g.purchasePrice:'', (g.currentValue??g.value)!=null&&(g.currentValue??g.value)!==''?'Recorded value: $'+(g.currentValue??g.value):'Value not recorded'].filter(Boolean).join(' · ');$('price').href='https://www.pricecharting.com/search-products?q='+encodeURIComponent(g.title+' '+platform(g));}

function dims(p){if(/Super Nintendo|Nintendo 64|Super Famicom|Atari Jaguar/.test(p))return [.98,.69,.19];if(/Game Boy|Game Gear|Neo Geo Pocket|WonderSwan/.test(p))return [.67,.72,.19];if(/PS1|Dreamcast|Sega CD|Neo Geo CD|TurboGrafx-CD/.test(p))return [.77,.68,.10];if(/Nintendo DS|Nintendo 3DS/.test(p))return [.79,.72,.14];if(/Switch|PS Vita|PSP/.test(p))return [.65,1.02,.10];if(/NES|Genesis|Master System|Saturn|Atari/.test(p))return [.79,1.1,.20];return [.77,1.08,.14];}

let db;async function artURL(s){if(typeof s!=='string')return null;if(/^art:/.test(s)){if(!db)db=await new Promise((res,rej)=>{const r=indexedDB.open('VGC407Artwork',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});const blob=await new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(s);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return blob?URL.createObjectURL(blob):null;}return /^(https?:|data:image\/)/i.test(s)?s:null;}
function paint(target,source,text){target.replaceChildren();const label=document.createElement('span');label.textContent=text;target.append(label);artURL(source).then(url=>{if(!url)return;const img=new Image();img.alt=text;img.onload=()=>{if(url.startsWith('blob:'))URL.revokeObjectURL(url);};img.onerror=()=>{img.remove();if(url.startsWith('blob:'))URL.revokeObjectURL(url);};img.src=url;target.append(img);}).catch(()=>{});}
let selected=null,lastTap=0,angle=0;
function draw(){const root=$('cabinet');root.replaceChildren();selected=null;const list=filtered();$('stats').textContent=(demo?'Demo collection · ':'')+list.length+' games · Recorded value $'+list.reduce((n,g)=>n+(Number(g.currentValue??g.value)||0),0).toFixed(2);for(const p of new Set([...systems,...games.map(platform)])){if($('platform').value&&p!==$('platform').value)continue;const group=list.filter(g=>platform(g)===p);if(!group.length&&(!$('empty').checked||$('search').value))continue;const bay=document.createElement('section');bay.className='bay';bay.style.setProperty('--led',theme(p));const h=document.createElement('h2');h.textContent=p+' · '+group.length;const strip=document.createElement('div');strip.className='strip';const books=document.createElement('div');books.className='books';bay.append(h,strip,books);for(const g of group){const b=document.createElement('button');b.className='game';b.title=g.title;b.setAttribute('aria-label',g.title+'; double tap to inspect');const d=dims(p);b.style.setProperty('--w',Math.max(24,d[2]*190)+'px');b.style.setProperty('--h',Math.round(d[1]*145)+'px');paint(b,g.spine,g.title);b.onclick=e=>{const now=Date.now();if(selected===b&&now-lastTap<550){open(g);lastTap=0;return;}selected?.classList.remove('selected');selected=b;b.classList.add('selected');lastTap=now;$('selection').textContent=g.title;};b.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();open(g);}};books.append(b);}if(!group.length){const t=document.createElement('div');t.className='empty';t.textContent='Empty shelf';books.append(t);}root.append(bay);}if(!root.children.length)root.textContent='No games found.';lighting();}
function lighting(){$('cabinet').style.setProperty('--power',Number($('brightness').value)/100);}
function rotate(a){angle=a;$('case').style.transform='rotateY('+angle+'deg)';}
function open(g){details(g);const d=dims(platform(g));const scale=Math.min(250/d[1],260/d[0]);const c=$('case');c.style.setProperty('--cw',d[0]*scale+'px');c.style.setProperty('--ch',d[1]*scale+'px');c.style.setProperty('--depth',d[2]*scale+'px');c.style.setProperty('--half',d[2]*scale/2+'px');paint($('front'),g.cover||g.front,g.title);paint($('spine'),g.spine,g.title);paint($('back'),g.back,'Back artwork unavailable');$('viewer').hidden=false;rotate(0);}
$('close').onclick=()=>{$('viewer').hidden=true;};document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>rotate(Number(b.dataset.angle)));let drag=null;$('stage').onpointerdown=e=>{drag={x:e.clientX,a:angle};$('stage').setPointerCapture(e.pointerId);};$('stage').onpointermove=e=>{if(drag)rotate(drag.a+(e.clientX-drag.x)*1.1);};$('stage').onpointerup=$('stage').onpointercancel=()=>drag=null;$('search').oninput=draw;$('platform').onchange=draw;$('empty').onchange=draw;$('brightness').oninput=lighting;window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});draw();</script></body></html>
